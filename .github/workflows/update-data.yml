name: Proje verilerini güncelle

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [release-published]
  push:
    paths:
      - 'scripts/build-data.mjs'
      - '.github/workflows/update-data.yml'

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: data.json üret
        run: node scripts/build-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
      - name: Değişiklik varsa kaydet
        run: |
          if [ -n "$(git status --porcelain data.json profile-readme.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json profile-readme.md
            git commit -m "data.json güncellendi"
            git pull --rebase origin main || true
            git push
          fi
      - name: Yeni sürüm bildirimi (Telegram, isteğe bağlı)
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f new-releases.txt ] && [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT}" \
              --data-urlencode "text=$(cat new-releases.txt)" > /dev/null
          fi
      - name: Profil README'sini güncelle (isteğe bağlı)
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_REPO_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$PROFILE_TOKEN" ] && [ -f profile-readme.md ]; then
            git clone "https://x-access-token:${PROFILE_TOKEN}@github.com/${OWNER}/${OWNER}.git" /tmp/profile
            cp profile-readme.md /tmp/profile/README.md
            cd /tmp/profile
            if [ -n "$(git status --porcelain)" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add README.md
              git commit -m "README güncellendi"
              git push
            fi
          fi
